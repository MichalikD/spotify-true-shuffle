<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Spotify True Shuffle Auth</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
<h2>Spotify Login</h2>
<p id="status">Starte Anmeldung...</p>

<script>
const REDIRECT_URI =
    window.location.origin + window.location.pathname;

const SCOPES = [
    "user-read-playback-state",
    "user-modify-playback-state",
    "playlist-read-private",
    "playlist-read-collaborative",
    "playlist-modify-private",
    "playlist-modify-public"
].join(" ");

function base64UrlEncode(arrayBuffer) {
    let binary = "";
    const bytes = new Uint8Array(arrayBuffer);

    bytes.forEach(byte => {
        binary += String.fromCharCode(byte);
    });

    return btoa(binary)
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=/g, "");
}

function generateRandomString(length) {
    const chars =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";

    let result = "";

    const randomValues = new Uint8Array(length);
    crypto.getRandomValues(randomValues);

    randomValues.forEach(value => {
        result += chars[value % chars.length];
    });

    return result;
}

async function createChallenge(verifier) {
    const encoder = new TextEncoder();
    const data = encoder.encode(verifier);

    const hash = await crypto.subtle.digest(
        "SHA-256",
        data
    );

    return base64UrlEncode(hash);
}

async function startLogin(clientId) {
    const verifier = generateRandomString(64);

    sessionStorage.setItem(
        "spotify_code_verifier",
        verifier
    );

    sessionStorage.setItem(
        "spotify_client_id",
        clientId
    );

    const challenge = await createChallenge(verifier);

    const url =
        "https://accounts.spotify.com/authorize" +
        "?client_id=" + encodeURIComponent(clientId) +
        "&response_type=code" +
        "&redirect_uri=" + encodeURIComponent(REDIRECT_URI) +
        "&code_challenge_method=S256" +
        "&code_challenge=" + encodeURIComponent(challenge) +
        "&scope=" + encodeURIComponent(SCOPES);

    window.location.href = url;
}

async function handleCallback() {
    const params =
        new URLSearchParams(window.location.search);

    const code = params.get("code");
    const error = params.get("error");
    const incomingClientId = params.get("client_id");

    /*
     * Spotify removes our client_id query parameter when
     * redirecting back to the configured Redirect URI.
     *
     * Store it for the duration of the authentication flow.
     */
    if (incomingClientId) {
        sessionStorage.setItem(
            "spotify_client_id",
            incomingClientId
        );
    }

    const clientId =
        incomingClientId ||
        sessionStorage.getItem("spotify_client_id");

    /*
     * Spotify returned an authorization error.
     */
    if (error) {
        document.getElementById("status").innerHTML =
            "Spotify-Anmeldung fehlgeschlagen.<br>" +
            "Fehler: " + error;

        return;
    }

    /*
     * Spotify returned the authorization code.
     */
    if (code) {
        document.getElementById("status").innerHTML =
            "Login erfolgreich.<br>Zurück zu Kurzbefehle...";

        const verifier = sessionStorage.getItem(
            "spotify_code_verifier"
        );

        if (!verifier) {
            document.getElementById("status").innerHTML =
                "Login fehlgeschlagen.<br>" +
                "PKCE Code Verifier wurde nicht gefunden.";

            return;
        }

        const callback =
            "shortcuts://x-callback-url/run-shortcut" +
            "?name=Spotify%20Login%20Callback" +
            "&input=text" +
            "&text=" +
            encodeURIComponent(
                JSON.stringify({
                    code: code,
                    verifier: verifier
                })
            );

        window.location.href = callback;

        return;
    }

    /*
     * Initial page load.
     *
     * The Spotify Login Shortcut must provide the Client ID:
     *
     * https://.../?client_id=...
     */
    if (!clientId) {
        document.getElementById("status").innerHTML =
            "Spotify Client ID fehlt.<br>" +
            "Bitte starte die Anmeldung über " +
            "den Spotify Login Kurzbefehl.";

        return;
    }

    startLogin(clientId);
}

handleCallback();
</script>

</body>
</html>
